<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Minecraft PvP Championship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-sm-2 px-lg-4">

                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="images/logo.png" alt="MCTiers League logo" class="logo-img">
                    <span>MCTiers League</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Registration</a></li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <div class="container-fluid">
        <div class="row">

            <aside class="col-lg-3 px-sm-3 px-lg-4 py-4">
                <h2>Instructions</h2>
                <p>Fill out your actual IGN and Discord tag to successfully pass the verification process.</p>
            </aside>

            <main class="col-lg-9 py-4 px-sm-3 px-lg-5">

                <h1>Player Registration</h1>
                <p class="mb-4">Join upcoming qualification duels.</p>

                <form>

                    <div class="mb-3">
                        <label for="ign" class="form-label">Minecraft Username / IGN:</label>
                        <input type="text" class="form-control" id="ign" placeholder="e.g. Steve_PvP" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Contact Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="discipline" class="form-label">Preferred Discipline:</label>
                        <select id="discipline" class="form-select">
                            <option>Sword 1.9+</option>
                            <option>Axe PvP</option>
                            <option>Crystal PvP</option>
                            <option>Pot PvP</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="experience" class="form-label">Experience & Discord Tag:</label>
                        <textarea id="experience" class="form-control" rows="4" placeholder="Discord: tag#0000" required></textarea>
                    </div>

                    <div class="btn-group" role="group" aria-label="Registration actions">
                        <button type="submit" class="btn btn-primary">Submit Application</button>
                        <button type="reset" class="btn btn-outline-secondary">Reset</button>
                    </div>

                </form>

            </main>

        </div>
    </div>

    <footer class="py-4">
        <p class="mb-0">Created by: Batyrkhan Uvayev & Yermek Sain | 2026</p>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
